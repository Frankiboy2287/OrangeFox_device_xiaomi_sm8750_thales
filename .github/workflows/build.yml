name: OFRP 14.1 Builder (SM8750 thales)

on:
  workflow_dispatch:
    inputs:
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "xiaomi/sm8750_thales"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "sm8750_thales"

concurrency:
  group: ofox-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Show build info
      run: |
        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Device path: ${{ github.event.inputs.DEVICE_PATH }}
          echo Device name: ${{ github.event.inputs.DEVICE_NAME }}
          echo Build date: $(date)
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"

    # 不要在 maximize-build-space 之前 checkout 任何内容（它会重挂载并清空工作区）

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true
        max-size: 4G
        append-timestamp: false

    - name: Setup zram
      run: |
        sudo apt install linux-modules-extra-$(uname -r) zram-tools -y
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap
        zramctl

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update -y
        command -v repo >/dev/null || sudo apt install -y repo
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"

    # 等价于 adontoo 的 "repo init nebrassy twrp-14 + orangefox_sync 14.1"：
    # 脚本内部会 repo init/sync twrp-14 minimal manifest + 打橙狐补丁 + 拉 OFOX recovery/vendor
    - name: Sync OrangeFox source (fox_14.1)
      run: |
        export LC_ALL=C
        cd "$GITHUB_WORKSPACE"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch 14.1 --path "$GITHUB_WORKSPACE/fo_source"

    - name: Clone device tree into source tree
      run: |
        cd "$GITHUB_WORKSPACE/fo_source/device"
        mkdir -p "${{ github.event.inputs.DEVICE_PATH }}"
        git clone --depth 1 -b "${{ github.ref_name }}" \
          "https://github.com/${{ github.repository }}.git" \
          "${{ github.event.inputs.DEVICE_PATH }}"
        echo -e "$BUILD_INFO" >> "$GITHUB_WORKSPACE/fo_source/device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt"
        ls -1 "${{ github.event.inputs.DEVICE_PATH }}" | head -30

    # 关键：这是让橙狐在 SM8750 上能启动的 recipe（来自 adontoo 实测可用方案）
    #  1) 对 bootable/recovery 打补丁（openaes C23 修复 + WLAN/microhttpd）
    #  2) 用 adontoo fork 的 bionic 替换原版 bionic（骁龙8 Elite/Oryon 相关修复，开机卡 logo 的根因）
    #  3) 加入 external/libmicrohttpd
    - name: Apply OFOX patches & swap bionic
      run: |
        WORKINGDIR="$GITHUB_WORKSPACE/fo_source"
        cd "$WORKINGDIR/bootable/recovery"
        git apply "$WORKINGDIR/device/${{ github.event.inputs.DEVICE_PATH }}/patches/"*.patch
        cd "$WORKINGDIR"
        git clone https://github.com/adontoo/android_external_libmicrohttpd -b ofox-14.1 external/libmicrohttpd
        rm -rf bionic
        git clone https://github.com/adontoo/OrangeFox-android_platform_bionic bionic

    # 更新内置 root 安装器：SukiSU 最新 .ko + 加入 FolkPatch/KernelSU APK（非致命）
    - name: Refresh root installers (SukiSU latest + FolkPatch)
      run: |
        bash "$GITHUB_WORKSPACE/fo_source/device/${{ github.event.inputs.DEVICE_PATH }}/scripts/refresh_root_installers.sh" \
          "$GITHUB_WORKSPACE/fo_source" \
          "device/${{ github.event.inputs.DEVICE_PATH }}"

    - name: Build OrangeFox recoveryimage
      run: |
        export LC_ALL=C
        cd "$GITHUB_WORKSPACE/fo_source"
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_EXEC=$(command -v ccache)
        lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-ap2a-eng
        (while true; do echo "$(date +%T) Building OFRP..."; free -h; df -h | tail -4; sleep 10; done) &
        TIP_PID=$!
        mka adbd recoveryimage
        kill $TIP_PID
        ls -la out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ | grep -iE '\.img$'

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        # 只上传最终可刷写的成品（跳过 ramdisk 中间产物）+ 最新 root 工具 APK
        files: |
          fo_source/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-*.img
          fo_source/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
          fo_source/root_tools/**/*.apk
        name: OrangeFox-R12-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
        body_path: fo_source/device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
